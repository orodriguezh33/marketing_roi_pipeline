services:
  postgres:
    image: postgres:16
    container_name: airbyte-mkt-roi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no está definido — copiá .env.example a .env y completalo}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no está definido — copiá .env.example a .env y completalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no está definido — copiá .env.example a .env y completalo}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT no está definido — copiá .env.example a .env y completalo}:5432"
    # Habilita replicación lógica para que Airbyte pueda hacer CDC (Fase 2).
    # max_replication_slots/max_wal_senders en 4 alcanza para un único slot (airbyte_slot).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DDL de las tablas Olist + creación de la publication (infra/postgres/init/) —
      # se ejecuta una sola vez, al crear el volumen por primera vez.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: airbyte-mkt-roi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL no está definido — copiá .env.example a .env y completalo}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD no está definido — copiá .env.example a .env y completalo}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:?PGADMIN_PORT no está definido — copiá .env.example a .env y completalo}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: airbyte-mkt-roi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER no está definido — copiá .env.example a .env y completalo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD no está definido — copiá .env.example a .env y completalo}
    ports:
      - "${MINIO_PORT:?MINIO_PORT no está definido — copiá .env.example a .env y completalo}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT no está definido — copiá .env.example a .env y completalo}:9001"
    # Puerto 9000 publicado al host para que Airbyte (corriendo dentro del cluster kind
    # de abctl) lo alcance vía http://host.docker.internal:9000 — ver Fase 2 en
    # docs/ROADMAP.md, sección "Riesgos y notas técnicas".
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
