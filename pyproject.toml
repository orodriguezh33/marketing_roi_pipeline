[project]
name = "airbyte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "stripe>=11.0.0",
    "boto3>=1.35.0",
    "gspread>=6.1.0",
    "google-auth>=2.35.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "great-expectations>=1.0",
    "duckdb>=1.1",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "pyarrow>=25.0.1",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff.lint]
# DTZ005/DTZ011: datetime.now()/date.today() naive son intencionales -- alimentan
# columnas Postgres `timestamp` sin tz (ver infra/postgres/init/01_schema.sql) y
# nombres de archivo/año locales. Volverlos tz-aware correría el riesgo real de
# correr el valor guardado por el offset UTC al insertarse en una columna naive.
ignore = ["DTZ005", "DTZ011"]
